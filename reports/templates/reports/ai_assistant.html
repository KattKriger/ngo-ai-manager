<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant - NGO Insight AI</title>
</head>

<body>
    <h1>AI Assistant</h1>

    <form method="post">
        {% csrf_token %}

        <input type="text" name="question" placeholder="Ask a question..." value="{{ question|default:'' }}" required>

        <button type="submit">Analyze</button>
    </form>

    {% if answer %}
        <div>{{ answer }}</div>
    {% endif %}
</body>
</html>
